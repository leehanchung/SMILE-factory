[tool.poetry]
name = "managed-agents"
version = "0.1.0"
description = "Self-hosted Claude Managed Agents clone — API server and runtime"
authors = ["Anthropic <support@anthropic.com>"]
license = "MIT"
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.12"

# Web framework and server
fastapi = ">=0.163.0,<1.0"
uvicorn = {version = ">=0.54.0,<1.0", extras = ["standard"]}
pydantic = "^2.14.0"
pydantic-settings = "^2.16.0"

# Database
sqlalchemy = {version = "^2.1.0", extras = ["asyncio"]}
asyncpg = ">=0.32.0,<1.0"  # PostgreSQL async driver
alembic = "^1.20.0"  # Database migrations

# Caching and task queues
redis = "^8.1.0"  # use redis.asyncio; aioredis is abandoned and broken on 3.11+

# HTTP client
httpx = ">=0.28.1,<1.0"
aiohttp = "^3.14.5"

# LLM integrations
anthropic = "^2.10.0"
openai = "^3.55.0"  # For vLLM compatibility

# Kubernetes client
kubernetes-asyncio = ">=36.1.0"

# System monitoring (for node agent)
psutil = "^7.2.0"

# Utilities
beautifulsoup4 = "^4.15.0"
html5lib = "^1.1"
python-dotenv = "^1.2.4"
click = "^8.5.0"
pyyaml = "^6.0.3"  # used by src/runtime/launcher.py

# Logging and observability
python-json-logger = "^4.2.0"
structlog = ">=26.1.0"

# Async utilities
asyncio-contextmanager = "^1.0.0"
tenacity = "^9.2.0"  # Retry logic

[tool.poetry.group.dev.dependencies]
pytest = "^9.2.0"
pytest-asyncio = "^1.5.0"
pytest-cov = "^7.1.0"
httpx = ">=0.28.1,<1.0"  # For test client
black = "^26.10.0"
ruff = ">=0.17.5,<0.18"
mypy = "^2.4.0"
isort = "^9.0.0"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "RUF"]
ignore = ["E501"]  # Line too long (handled by black)

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --cov=src --cov-report=term-missing"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
