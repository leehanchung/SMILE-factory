[project]
name = "delulu-discord"
version = "0.1.0"
description = "Discord bot that dispatches Claude Code tasks to Modal sandboxes"
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22",
    "discord.py>=2.7,<3",
    "modal>=1.6",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.14.2,<3",
    "structlog>=26.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.17",
    "pytest>=9.0",
    "pytest-asyncio>=1.5",
    "pytest-timeout>=2.3",
]

[project.scripts]
delulu-discord = "delulu_discord.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/delulu_discord"]

[tool.ruff]
# Pinned to py313 (even though requires-python is >=3.14) so ruff's
# formatter doesn't emit PEP 758 unparenthesized `except A, B:` syntax.
# That form is valid in 3.14 but trips the claude-code-review autofix,
# which treats it as a Python 2 SyntaxError and reverts every run.
target-version = "py313"
line-length = 100
# ruff >=0.17 also formats fenced code in Markdown; the prd/ docs hold
# illustrative pseudocode stubs, so keep them out of format/lint.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "integration: marks tests that call deployed Modal functions",
]
# Default: skip integration tests. CI's daily e2e workflow runs them
# explicitly with ``-m integration``.
addopts = "-m 'not integration'"
