[project]
name = "delulu-sandbox-modal"
version = "0.1.0"
description = "Modal sandbox function that runs Claude Code for the delulu Discord bot"
requires-python = ">=3.14"
dependencies = [
    "modal>=1.6",
    "structlog>=25.5",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.17",
    "pytest>=9.0",
    "pytest-timeout>=2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/delulu_sandbox_modal"]

[tool.ruff]
# Pinned to py313 (even though requires-python is >=3.14) so ruff's
# formatter doesn't emit PEP 758 unparenthesized `except A, B:` syntax.
# That form is valid in 3.14 but trips the claude-code-review autofix,
# which treats it as a Python 2 SyntaxError and reverts every run.
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests that call deployed Modal functions (deselect with '-m \"not integration\"')",
]
# Default: skip integration tests. Run them explicitly with:
#   uv run pytest tests/integration/ -v --timeout=180
addopts = "-m 'not integration'"
