default_language_version:
    python: python3
# `pre-commit install` sets up both the file hooks and the commit-msg hook.
default_install_hook_types: [pre-commit, commit-msg]
# File hooks run only at commit time; the commit-msg hook declares its own stage.
default_stages: [pre-commit, manual]
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    # tools/hstack mirrors github.com/leehanchung/hstack byte-for-byte (synced by
    # .github/workflows/hstack-publish.yml), so fixers and linters skip it.
    -   id: trailing-whitespace
        exclude: '^tools/hstack/'
    -   id: end-of-file-fixer
        exclude: '^tools/hstack/'
    -   id: check-yaml
        # Helm templates are Go-templated, not valid YAML until rendered.
        exclude: '/helm/.*/templates/'
        args:
        -   --unsafe
    -   id: check-added-large-files
        # machine-generated lockfiles are legitimately large (ML dep trees)
        exclude: '(\.lock$|^tools/hstack/)'
    -   id: check-xml
    -   id: check-toml
    -   id: check-json
    -   id: check-merge-conflict
    -   id: detect-aws-credentials
        args: [--allow-missing-credentials]
-   repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.11.0
    hooks:
    -   id: shellcheck
        exclude: '^tools/hstack/'
-   repo: https://github.com/asottile/pyupgrade
    rev: v3.22.0
    hooks:
    -   id: pyupgrade
        exclude: '^tools/hstack/'
        args:
        - --py3-plus
        - --keep-runtime-typing
# Modern ruff scoped to apps/ and training/. Each sub-project's
# pyproject.toml supplies its own ruff config via per-file-style
# discovery. Version should match the ruff each sub-project's uv.lock
# resolves (see docs/monorepo-conventions.md).
-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
    -   id: ruff
        files: ^(apps|training)/.*\.py$
        args: [--fix]
    -   id: ruff-format
        files: ^(apps|training)/.*\.py$
# Conventional Commits on every local commit message. Keep the type list
# in sync with .github/workflows/pr-title.yml and CLAUDE.md. Merge,
# fixup! and squash! commits are allowed (no --strict).
-   repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.5.0
    hooks:
    -   id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, docs, refactor, test, chore, ci, build, perf, style, revert, prd]
ci:
    autofix_commit_msg: "style: auto-format with pre-commit hooks"
    autoupdate_commit_msg: "chore: pre-commit autoupdate"
